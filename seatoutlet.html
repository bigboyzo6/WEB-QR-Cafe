<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR-Cafe - Seat & Outlet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="mobile-body">
  <div class="mobile-container has-nav">
    <header class="top-bar">
      <div class="brand">
        <span class="logo-icon">☕</span>
        <h2>QR-Cafe</h2>
      </div>
    </header>

    <main class="content-area">
      <h1 class="page-title">Find your cozy corner.</h1>
      <p class="page-sub">A quiet seat, a little power, a good coffee.</p>

      <div class="legend-row">
        <span class="legend-item"><span class="dot green"></span> Tersedia</span>
        <span class="legend-item"><span class="dot red"></span> Terisi</span>
        <span class="legend-item"><span class="icon-sm">🔌</span> Stopkontak</span>
      </div>

      <div class="map-card">
        <div class="bar-label">COFFEE BAR & PICKUP</div>
        
        <div class="seat-grid">
          <div class="seat-box occupied">01</div>
          <div class="seat-box available">02</div>
          <div class="seat-box occupied power">03 🔌</div>
          
          <div class="seat-box available">04</div>
          <div class="seat-box occupied">05</div>
          <div class="seat-box occupied">06</div>

          <div class="seat-box available">07</div>
          <div class="seat-box selected power">08 🔌</div>
          <div class="seat-box available power">09 🔌</div>
        </div>

        <div class="entrance-label">PINTU MASUK ↑</div>
      </div>

      <div class="selected-table-info">
        <div class="info-icon">🪑</div>
        <div class="info-text">
          <h4>Table 08</h4>
          <p>2 kursi · Ada stopkontak</p>
        </div>
        <span class="check-circle">✓</span>
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="homelanding.html" class="nav-item">
        <span class="icon">🏠</span>
        <span class="label">Home</span>
      </a>
      <a href="menucatalog.html" class="nav-item">
        <span class="icon">☕</span>
        <span class="label">Menu</span>
      </a>
      <a href="seatoutlet.html" class="nav-item active">
        <span class="icon">🪑</span>
        <span class="label">Meja</span>
      </a>
      <a href="index.html" class="nav-item">
        <span class="icon">🛍</span>
        <span class="label">Keranjang</span>
      </a>
    </nav>
  </div>

  <script src="script.js"></script>
</body>
</html>
