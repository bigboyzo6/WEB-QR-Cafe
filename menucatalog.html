<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR-Cafe - Menu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="mobile-body">
  <div class="mobile-container has-nav">
    <header class="top-bar">
      <div class="brand">
        <span class="logo-icon">☕</span>
        <h2>QR-Cafe</h2>
      </div>
    </header>

    <main class="content-area">
      <h1 class="page-title">Table</h1>
      <p class="page-sub">Menu favoritmu, dibuat saat dipesan.</p>

      <div class="category-tabs">
        <button class="tab-btn active">All</button>
        <button class="tab-btn">Vegetarian</button>
        <button class="tab-btn">Dairy-free</button>
      </div>

      <div class="section-header">
        <h3>Menu Favorit</h3>
        <span class="item-count">4 items</span>
      </div>

      <div class="menu-grid">
        <div class="menu-card" onclick="openCustom('Flat White', 4.50, 'https://images.unsplash.com/photo-1534778101976-62847782c213?auto=format&fit=crop&w=400&q=80')">
          <img src="https://images.unsplash.com/photo-1534778101976-62847782c213?auto=format&fit=crop&w=400&q=80" alt="Flat White">
          <div class="card-body">
            <h4>Flat White</h4>
            <p class="desc">Pilihan Barista</p>
            <div class="card-footer">
              <span class="price">$4.50</span>
              <button class="btn-add" onclick="event.stopPropagation(); addDirect('Flat White', 4.50, 'https://images.unsplash.com/photo-1534778101976-62847782c213?auto=format&fit=crop&w=400&q=80', 'Barista Pick');">+ Add</button>
            </div>
          </div>
        </div>

        <div class="menu-card" onclick="openCustom('Banana Bread', 3.20, 'https://images.unsplash.com/photo-1608198093002-ad4e005484ec?auto=format&fit=crop&w=400&q=80')">
          <img src="https://images.unsplash.com/photo-1608198093002-ad4e005484ec?auto=format&fit=crop&w=400&q=80" alt="Banana Bread">
          <div class="card-body">
            <h4>Banana Bread</h4>
            <p class="desc">Vegetarian</p>
            <div class="card-footer">
              <span class="price">$3.20</span>
              <button class="btn-add" onclick="event.stopPropagation(); addDirect('Banana Bread', 3.20, 'https://images.unsplash.com/photo-1608198093002-ad4e005484ec?auto=format&fit=crop&w=400&q=80', 'One slice · served warm');">+ Add</button>
            </div>
          </div>
        </div>

        <div class="menu-card" onclick="openCustom('Almond Croissant', 2.75, 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&w=400&q=80')">
          <img src="https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&w=400&q=80" alt="Almond Croissant">
          <div class="card-body">
            <h4>Almond Croissant</h4>
            <p class="desc">Mengandung kacang</p>
            <div class="card-footer">
              <span class="price">$2.75</span>
              <button class="btn-add" onclick="event.stopPropagation(); addDirect('Almond Croissant', 2.75, 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&w=400&q=80', 'Freshly baked');">+ Add</button>
            </div>
          </div>
        </div>

        <div class="menu-card" onclick="openCustom('Hot Chocolate', 3.00, 'https://images.unsplash.com/photo-1542990253-0d0f5be5f0ed?auto=format&fit=crop&w=400&q=80')">
          <img src="https://images.unsplash.com/photo-1542990253-0d0f5be5f0ed?auto=format&fit=crop&w=400&q=80" alt="Hot Chocolate">
          <div class="card-body">
            <h4>Hot Chocolate</h4>
            <p class="desc">Caffeine-free</p>
            <div class="card-footer">
              <span class="price">$3.00</span>
              <button class="btn-add" onclick="event.stopPropagation(); addDirect('Hot Chocolate', 3.00, 'https://images.unsplash.com/photo-1542990253-0d0f5be5f0ed?auto=format&fit=crop&w=400&q=80', 'Regular · whole milk');">+ Add</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="homelanding.html" class="nav-item">
        <span class="icon">🏠</span>
        <span class="label">Home</span>
      </a>
      <a href="menucatalog.html" class="nav-item active">
        <span class="icon">☕</span>
        <span class="label">Menu</span>
      </a>
      <a href="seatoutlet.html" class="nav-item">
        <span class="icon">🪑</span>
        <span class="label">Meja</span>
      </a>
      <a href="index.html" class="nav-item">
        <span class="icon">🛍</span>
        <span class="label">Keranjang</span>
      </a>
    </nav>
  </div>

  <script src="script.js"></script>
</body>
</html>
