<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR-Cafe Catalog</title>
  <link rel="stylesheet" href="style.css">
  <!-- Menggunakan Font Inter dari Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="menu-catalog">
    <div class="menu-content">
      
      <!-- Header Section -->
      <header class="header">
        <div class="brand">
          <svg class="coffee-mark" width="26" height="18" viewBox="0 0 26 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Logo Coffee Mark">
            <path d="M1.36816 1.00043H20.5264C21.7127 1.00044 22.8505 1.47121 23.6895 2.31C24.5284 3.14898 25 4.28757 25 5.47406C24.9999 6.66043 24.5283 7.79825 23.6895 8.63715C22.8505 9.47602 21.7128 9.94768 20.5264 9.94769H18.1582V12.3159C18.1582 13.5023 17.6865 14.64 16.8477 15.4789C16.0088 16.3178 14.8709 16.7894 13.6846 16.7895H5.47363C4.28716 16.7895 3.14951 16.3179 2.31055 15.4789C1.47158 14.64 1.00001 13.5023 1 12.3159V1.36859C1 1.27098 1.03846 1.17692 1.10785 1.10785C1.17645 1.03882 1.27055 1.0005 1.36816 1.00043Z" stroke="#4A2C2A" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span class="brand-title">QR-Cafe</span>
        </div>
        <div class="table-badge">
          <span class="table-number">08</span>
        </div>
      </header>

      <!-- Introduction Section -->
      <div class="introduction">
        <span class="intro-title">Table 08</span>
        <!-- Mengubah subtitle menjadi h1 sebagai judul utama dokumen -->
        <h1 class="intro-subtitle">Menu favoritmu, dibuat saat dipesan.</h1>
      </div>

      <!-- Dietary Filters Section -->
      <div class="dietary-filters">
        <div class="dietary-tag active">
          <span class="tag-text">All</span>
        </div>
        <div class="dietary-tag">
          <span class="tag-text">Vegetarian</span>
        </div>
        <div class="dietary-tag">
          <span class="tag-text">Dairy-free</span>
        </div>
      </div>

      <!-- Menu Selection Section -->
      <section class="menu-selection">
        <div class="section-heading">
          <h2 class="heading-title">Menu Favorit</h2>
          <span class="heading-count">4 items</span>
        </div>

        <!-- Product Grid -->
        <div class="product-grid">
          
          <!-- Row 1 -->
          <div class="product-row">
            <!-- Product 1 -->
            <div class="product-card">
              <img class="product-image" src="Assets/flat-white.png" alt="Flat White">
              <div class="product-info">
                <span class="product-title">Flat White</span>
                <span class="product-desc">Pilihan Barista</span>
                <div class="purchase-row">
                  <span class="product-price">$4.50</span>
                  <div class="add-btn">
                    <span class="add-btn-text">+ Add</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- Product 2 -->
            <div class="product-card">
              <img class="product-image" src="Assets/banana-bread.png" alt="Banana Bread">
              <div class="product-info">
                <span class="product-title">Banana Bread</span>
                <span class="product-desc">Vegetarian</span>
                <div class="purchase-row">
                  <span class="product-price">$3.20</span>
                  <div class="add-btn">
                    <span class="add-btn-text">+ Add</span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Row 2 -->
          <div class="product-row">
            <!-- Product 3 -->
            <div class="product-card">
              <img class="product-image" src="Assets/almond-croissant.png" alt="Almond Croissant">
              <div class="product-info">
                <span class="product-title">Almond Croissant</span>
                <span class="product-desc">Mengandung kacang</span>
                <div class="purchase-row">
                  <span class="product-price">$2.75</span>
                  <div class="add-btn">
                    <span class="add-btn-text">+ Add</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- Product 4 -->
            <div class="product-card">
              <img class="product-image" src="Assets/hot-chocolate.png" alt="Hot Chocolate">
              <div class="product-info">
                <span class="product-title">Product Name</span>
                <span class="product-desc">Deskripsi Produk</span>
                <div class="purchase-row">
                  <span class="product-price">$0.00</span>
                  <div class="add-btn">
                    <span class="add-btn-text">+ Add</span>
                  </div>
                </div>
              </div>
            </div>
          </div>

        </div>
      </section>

    </div>
  </div>

</body>
</html>
