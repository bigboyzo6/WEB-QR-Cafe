<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <div class="seat-and-outlet-map">
    
    <!-- Seat Content Section -->
    <div class="seat-content">
      
      <!-- Header -->
      <div class="header">
        <div class="brand">
          <svg class="coffee-mark" width="26" height="18" viewBox="0 0 26 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Coffee Mark Logo">
            <path d="M1.36816 1.00043H20.5264C21.7127 1.00044 22.8505 1.47121 23.6895 2.31C24.5284 3.14898 25 4.28757 25 5.47406C24.9999 6.66043 24.5283 7.79825 23.6895 8.63715C22.8505 9.47602 21.7128 9.94768 20.5264 9.94769H18.1582V12.3159C18.1582 13.5023 17.6865 14.64 16.8477 15.4789C16.0088 16.3178 14.8709 16.7894 13.6846 16.7895H5.47363C4.28716 16.7895 3.14951 16.3179 2.31055 15.4789C1.47158 14.64 1.00001 13.5023 1 12.3159V1.36859C1 1.27098 1.03846 1.17692 1.10785 1.10785C1.17645 1.03882 1.27055 1.0005 1.36816 1.00043Z" stroke="#4A2C2A" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span class="brand-title">QR-Cafe</span>
        </div>
        <div class="table-badge">
          <span class="badge-text">08</span>
        </div>
      </div>

      <!-- Introduction -->
      <div class="introduction">
        <h1 class="intro-heading">Find your cozy corner.</h1>
        <span class="intro-subheading">A quiet seat, a little power, a good coffee.</span>
      </div>

      <!-- Cafe Layout Section -->
      <div class="cafe-layout">
        
        <!-- Map Legend -->
        <div class="map-legend">
          <div class="legend-item">
            <span class="legend-dot available-dot"></span>
            <span class="legend-text">Tersedia</span>
          </div>
          <div class="legend-item">
            <span class="legend-dot occupied-dot"></span>
            <span class="legend-text">Terisi</span>
          </div>
          <div class="legend-item">
            <svg class="icon-plug" width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M1.16626 12.8333L2.91626 11.0833M4.37459 7.875L5.83293 6.41667M6.12459 9.625L7.58293 8.16667M10.4163 1.75L8.16626 4.08333M3.67461 11.8417C4.4802 12.2534 5.20316 12.1464 5.65795 11.8417L6.99961 10.5L3.49961 7L2.15795 8.34167C1.78255 8.96663 1.74618 9.33333 2.15795 10.325L3.67461 11.8417Z" stroke="#4A2C2A" stroke-width="1.8" stroke-linecap="round"/>

            <span class="legend-text">Stopkontak</span>
          </div>
        </div>

        <!-- Floorplan Diagram -->
        <div class="floorplan">
          <div class="coffee-bar">
            <span class="bar-text">COFFEE BAR &amp; PICKUP</span>
          </div>

          <!-- Table Row 1 -->
          <div class="table-row table-row-1">
            <div class="cafe-table">
              <span class="chair chair-left"></span>
              <span class="chair chair-right"></span>
              <div class="table-select occupied">
                <span class="table-number">01</span>
              </div>
            </div>

            <div class="cafe-table">
              <span class="chair chair-left"></span>
              <span class="chair chair-right"></span>
              <div class="table-select available">
                <span class="table-number">02</span>
              </div>
            </div>

            <div class="cafe-table">
              <span class="chair chair-left"></span>
              <span class="chair chair-right"></span>
              <div class="table-select occupied">
                <span class="table-number">03</span>
              </div>
            </div>
          </div>

          <!-- Table Row 2 -->
          <div class="table-row table-row-2">
            <div class="cafe-table">
              <span class="chair chair-left"></span>
              <span class="chair chair-right"></span>
              <div class="table-select available">
                <span class="table-number">04</span>
              </div>
            </div>

            <div class="cafe-table">
              <span class="chair chair-left"></span>

              </div>

            <div class="cafe-table">
              <span class="chair chair-left"></span>
              <span class="chair chair-right"></span>

                <span class="table-number">06</span>
              </div>
            </div>
          </div>

          <!-- Table Row 3 -->
          <div class="table-row table-row-3">
            <div class="cafe-table">
              <span class="chair chair-left"></span>
              <span class="chair chair-right"></span>
              <div class="table-select available">
                <span class="table-number">07</span>
              </div>
            </div>

            <div class="cafe-table">
              <span class="chair chair-left"></span>
              <span class="chair chair-right"></span>
              <div class="table-select selected">
                <span class="table-number selected-text">08</span>
              </div>
            </div>

            <div class="cafe-table">
              <span class="chair chair-left"></span>
              <span class="chair chair-right"></span>
              <div class="table-select available">
                <span class="table-number">09</span>
              </div>
            </div>
          </div>

          <span class="entrance-text">PINTU MASUK &uarr;</span>

            <svg class="icon-plug" width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

          </div>
        </div>

      </div>

      <div class="selected-table-card">
        <svg class="armchair-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
