<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR-Cafe - Verifikasi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="mobile-body">
  <div class="mobile-container form-container">
    <div class="cafe-header">
      <span class="logo-icon">☕</span>
      <h1 class="logo-title">QR-Cafe</h1>
    </div>

    <div class="title-section">
      <h2>Nikmati Suasana Kafe Kami.</h2>
      <p class="subtitle">Isi dulu data diri anda.</p>
    </div>

    <form id="verify-form" class="auth-form">
      <div class="form-group">
        <label>Email</label>
        <div class="input-wrapper">
          <span class="input-icon">✉</span>
          <input type="email" id="input-email" placeholder="Masukkan email anda" required>
        </div>
      </div>

      <div class="form-group">
        <label>Nama</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input type="text" id="input-nama" placeholder="Masukkan nama anda" required>
        </div>
      </div>

      <div class="form-group">
        <label>No Meja</label>
        <div class="input-wrapper">
          <span class="input-icon">📷</span>
          <input type="text" id="input-meja" placeholder="Masukkan nomor meja (misal: Meja 08)" required>
        </div>
      </div>

      <div class="status-info">
        <span class="check-icon">✓</span>
        <span>Meja terverifikasi, anda dapat melanjutkan pesanan</span>
      </div>

      <button type="submit" class="btn btn-dark btn-full">Verifikasi Saya</button>
    </form>

    <p class="disclaimer">Data hanya untuk pemesanan, bukan untuk tujuan lain.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
